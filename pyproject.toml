[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "evy"
description = "A GEE-first library for vegetation index zonal statistics"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["evi", "ndvi", "vegetation-index", "zonal-statistics", "earth-engine", "gee"]
authors = [{ name = "Development Data Group", email = "datalab@worldbank.org" }]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3 :: Only",
	"License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Topic :: Scientific/Engineering",
]
dynamic = ["version"]

requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "earthengine-api>=1.0.0",
    "geemap>=0.30.0",
    "geopandas>=0.14.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "scipy>=1.17.0",
    "xarray>=2025.12.0",
    "pystac-client>=0.7.0",
    "odc-stac>=0.3.0",
    "planetary-computer>=1.0.0",
    "dask>=2024.1.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.15.0",
    "exactextract>=0.2.0",
    "platformdirs>=4.0.0",
    "tenacity>=8.0.0",
    "pyarrow>=15.0.0",
]
[project.optional-dependencies]
docs = [
	"docutils==0.17.1", # pinned to docutils==0.17.1 due to https://github.com/worldbank/template/issues/60. See also: https://jupyterbook.org/en/stable/content/citations.html?highlight=docutils#citations-and-bibliographies
	"jupyter-book>=1,<2",
	"sphinx-autodoc2>=0.5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "papermill>=2.5.0",
    "nbstripout>=0.6.0",
]

[project.urls]
"Homepage" = "https://github.com/datapartnership/evy"
"Bug Reports" = "https://github.com/datapartnership/evy/issues"
"Source" = "https://github.com/datapartnership/evy"

[tool.codespell]
skip = 'docs/_build,docs/bibliography.bib,*.png,*.gz,*.whl'
ignore-regex = '^\s*"image\/png":\s.*'
ignore-words-list = "gost,Nd"

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*"
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv.sources]
attaviz = { git = "https://github.com/datapartnership/attaviz.git" }

[dependency-groups]
dev = [
    "attaviz",  # chart theme used in the notebooks only
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "jupyter>=1.1.1",
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]
