[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "evy"
description = "A python package to fetch and analyze EVI data"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["evi", "reproducibility"]
authors = [{ name = "Development Data Group", email = "datalab@worldbank.org" }]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3 :: Only",
	"License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Topic :: Scientific/Engineering",
]
dynamic = ["version"]

requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "leafmap>=0.50.2",
    "mapclassify>=2.10.0",
    "planetary-computer>=1.0.0",
    "plotnine>=0.15.0",
    "pystac-client>=0.9.0",
    "rasterstats>=0.19.0",
    "rioxarray>=0.19.0",
    "stackstac[viz]>=0.5.1",
    "xarray>=2025.9.0",
    "xvec>=0.5.1",
]
[project.optional-dependencies]
docs = [
	"docutils==0.17.1", # pinned to docutils==0.17.1 due to https://github.com/worldbank/template/issues/60. See also: https://jupyterbook.org/en/stable/content/citations.html?highlight=docutils#citations-and-bibliographies
	"jupyter-book>=1,<3",
]

[project.urls]
"Homepage" = "https://github.com/datapartnership/evy"
"Bug Reports" = "https://github.com/datapartnership/evy/issues"
"Source" = "https://github.com/datapartnership/evy"

[tool.codespell]
skip = 'docs/_build,docs/bibliography.bib,*.png,*.gz,*.whl'
ignore-regex = '^\s*"image\/png":\s.*'
ignore-words-list = "gost,Nd"

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*"
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
